<text x="824" y="630" font-size="18" fill="#26342E" font-weight="600" class="serif" text-anchor="start">关于这本手簿</text>
<text x="824" y="666" font-size="15" fill="#26342E" font-weight="500" class="" text-anchor="start">理小龙 CDUTdino</text>
<text x="824" y="695" font-size="13" fill="#5D685E" font-weight="400" class="" text-anchor="start">成都理工大学校园问答、资料检索与地点助手。</text>
<text x="824" y="730" font-size="12" fill="#5D685E" font-weight="400" class="" text-anchor="start">根据资料提供指引，不代表学校已受理或完成业务。</text>
