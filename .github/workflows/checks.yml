name: Checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        id: sync
        run: uv sync --locked --all-extras
      - name: Ruff
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --offline --locked --all-extras ruff check
      - name: Mypy
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --offline --locked --all-extras mypy
      - name: Pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --offline --locked --all-extras pytest -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node contract tests
        run: node --test tests/*.test.js tests/*.test.mjs
