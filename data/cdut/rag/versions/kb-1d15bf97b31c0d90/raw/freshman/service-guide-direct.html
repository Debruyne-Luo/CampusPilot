        display: block;
    }
    #service-publish-dept span img{
        width: 18px;
        vertical-align: middle;
        margin-left: 4px;
        display: inline-block;
    }
    #service-publish-dept:hover > span img{
        transform: rotateZ(180deg);
    }
    #service-publish-dept span{
        display: inline-block;
        height: 40px;
        line-height: 40px;
        font-size: 16px;
        padding:0 22px;
        box-sizing: border-box;
        cursor: pointer;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
       
    }
    #service-publish-dept div{
        position: absolute;
        display: none;
        left: 74px; 
        width: 200px;
        height: 310px;
        overflow: auto;
        top: 38px;
        background: #fff;
        z-index: 9999;
    }
    #service-publish-dept div button{
        border-radius: 0;
        display: block;
        width: 100%;
        margin: 0 auto 1px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
        font-size: 12px;
    }
    .service-search-group {
        margin-right: 0;
        /* margin-left: 20px; */
        float: left;
    }
    .btn-refresh{
        float: left;
    }
    #matters-tab{
        float: right;
    }
    .letters-nav-box{
        display: none !important;
    }
    .service-list table th:nth-child(-n+5){
        cursor: pointer;
    }
    .table th:nth-child(1) img{
        display: inline-block;
    }
    .table th img{
        width: 12px;
        display: none;
        vertical-align: middle;
    }
    .table th img.on{
        transform: rotateZ(180deg);
    }
    .service-screening-items{
        overflow: visible;
    }
    #service-publish-dept span.active {
        background: var(--main-color) !important;
    }
    #service-publish-dept span.active {
        color: #fff;
        background: #003c88;
    }




   
</style>
</head>
<body>


<div class="container main-box" style="padding: 10px 0 0;">
    <section>
        <div class="list-title">事项类型</div>
        <ul class="department-list" id="service-type-box">
           
        </ul>
    </section>
    
    <section>
        <div class="handle-affairs-center-head">
            <div class="service-search-box" style="margin-bottom: 45px;">
                <div id="matters-tab" class="tab-group fl">
                    <button class="btn btn-default btn-lg" id="true">与我相关</button>
                    <button class="btn btn-default btn-lg" id="false">全部事项</button>
                </div>
                <div class="service-search-group fr">
                    <input class="service-search fr" type="text" name="keyword" id="keyword" placeholder="请输入关键字">
                    <button class="service-search-btn" onclick="searchByKey()"><img onload="SVGInject(this)" src="/EIP/resources/images/elobby/icon-btn-search.svg" alt=""></button>
                </div>
                <button class="btn-refresh fr" onclick="reset()"><img onload="SVGInject(this)" src="/EIP/resources/images/elobby/icon-btn-refresh.svg" alt=""></button>
            </div>
            <div class="service-screening">
                <!-- <div class="row">
                    <div class="service-screening-title">事项类型</div>
                    <div id="service-type-box" class="service-screening-items">
                    </div>
                </div> -->
                <div class="row">
                    <div class="service-screening-title">服务对象</div>
                    <div id="service-object-box" class="service-screening-items">
                        <!-- <button class="btn btn-default">全部分类</button> -->
                    </div>
                </div>
                <div class="row">
                    <div class="service-screening-title">办理途径</div>
                    <div id="service-handle-way" class="service-screening-items">
                    </div>
                </div>
                <div class="row">
                    <div class="service-screening-title">所属部门</div>
                    <div id="service-publish-dept" class="service-screening-items">
                        <span>全部部门 <img src="/EIP/resources/images/select.png" alt=""></span>
                        <div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="service-list">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th width="10%" class="num">事项编号 <img src="/EIP/resources/images/triangle.png" alt=""></th>
                    <th width="23%" class="name">事项名称 <img src="/EIP/resources/images/triangle.png" alt=""></th>
                    <th width="23%" class="office">所属部门 <img src="/EIP/resources/images/triangle.png" alt=""></th>
                    <th width="22%" class="obj">服务对象</th>
                    <th width="12%" class="shape">事项类型</th>
                    <th width="10%">收藏</th>
                </tr>
                </thead>
                <tbody id="serviceDataBody">
                </tbody>
            </table>
        </div>

        <div class="paging-box">
            <div class="paging" id="paging"></div>
        </div>

    </section>
    
</div>



<!-- 页脚 -->

<div class="footer-bg">
    <div class="container footer-box" id="footer">
        
    </div>
</div>

<script type="text/javascript"
        src="/EIP/resources/js/onewebsitehandle/onewebsitehandle.js?1726842041000"></script>
<script type="text/javascript">
    $(function () {
        //请求页脚
        $.ajax({
            url: basePath + 'nonlogin/portal/queryPageFooter.htm',
            type: 'get',
            cache: false,
            success: function (result) {
                if (result.code == 200) {
                    var data = result.data;
                    data = data.replace(/&amp;/g,'&');
                    $('#footer').html(data);
                }
            }
        });
    });
</script>



<script type="text/javascript" src="/EIP/resources/js/onewebsitehandle/portal-public.js?1726842041000"></script>
<script type="text/javascript" src="/EIP/resources/js/onewebsitehandle/servicehall.js?1726842041000"></script>
<script type="text/javascript" src="/EIP/resources/js/onewebsitehandle/onewebsitehandle.js?1726842041000"></script>
<script type="text/javascript" src="/EIP/core/svg-inject.min.js?1709543532000 "></script>
<script type="text/javascript" src="/EIP/core/paging/paging.js?1709543532000"></script>
<script>
    var deptId = '';
    var serviceObjectId = '';
    var basePath = '/EIP/';
    var pageIndex = 0;
    var pageSize = 21;
    var totalPage = 0;
    var totalCount = 0;
    var lastSeclectedPageNo = 1;
    var serviceList = []
    var numFlag , nameFlag , officeFlag , objFlag , shapeFlag = '';
    var array = [
        {
            node: '.table .num',
            flag: false, 
            field: 'code',
            active: false
        },
        {
            node: '.table .name',
            flag: false, 
            field: 'name',
            active: false
        },
        {
            node: '.table .office',
            flag: false, 
            field: 'deptName',
            active: false
        },
        {
            node: '.table .obj',
            flag: false, 
            field: 'serviceObjectName',
            active: false
        },
        {
            node: '.table .shape',
            flag: false, 
            field: 'typeName',
            active: false
        },
    ]
    $(function(){
        initLoginInfo();
        mattersSwitch();
        loadDept();//所属部门
        loadServiceType();//服务类型
        loadServiceObject();//服务对象
        loadHandleWay();//办理方式
        classifySwitch();
        search();
        initPage();
    });
    
    function structureService(services){
        var tr='';
        var transactWayName = '';
        for(var i=0,count = services.length;i<count;i++){
            var service = services[i];
            var extend = service.extends;
            var typeId = service.type;
            var openType = "0";
            if(service.service[2].openType){
                openType = service.service[2].openType;
            }else if(service.service[2].blArr[0]){
                openType = service.service[2].blArr[0].openType;
            }
            var typeName = queryServiceTypeNameByTypeId(typeId);
            var serviceObjectName = queryServceObjectByRole(service.role);
            services[i]['serviceObjectName'] = serviceObjectName
            services[i]['typeName'] = typeName
            if(extend) {
                transactWayName = queryHandleWay(extend.entry);
            }else {
                transactWayName = '';
            }
            tr += "<tr><td><span title="+service.code+">"+(service.code == null ? '' : service.code)+"</span></td>";
            tr += "<td><span><a class=\"new_Button\" style=\"cursor: pointer;\" title="+ service.name +" onclick=\"openServiceItem('" + service.id + "','" + service.name + "','"+openType+"' )\">"+ service.name + "</a></span></td>";
            tr += "<td><span title="+service.deptName+">"+(service.deptName == null ? '' : service.deptName)+"</span></td>";
            tr += "<td><span title=\""+(serviceObjectName == null?'':serviceObjectName)+"\">"+(serviceObjectName == null?'':serviceObjectName)+"</span></td>";
            // tr += "<td><span title="+service.deptName+">"+(service.deptName == null ? '' : service.deptName)+"</span></td>";
            tr += "<td><span title=\""+(typeName == null?'':typeName)+"\">"+(typeName == null?'':typeName)+"</span></td>";
            //tr += "<td><span><a id=\"fav-"+sid+"\" style=\"cursor: pointer;display:none\" onclick=\"fav('"+service.id+"')\"><img onload=\"SVGInject(this)\" src=\"/EIP/resources/images/elobby/icon-collect.svg \"></a></span></td>";
            //如果用户收藏了服务，显示已收藏图标，
            if(service.isf){
                tr += "<td><span><a class='collect-fill' id=\"fav-"+service.id+"\" style=\"cursor: pointer\" onclick=\"cancelFavServiceItem('"+service.id+"')\"></a></span></td>";
            }else{
                tr += "<td><span><a class='collect-line' id=\"fav-"+service.id+"\" style=\"cursor: pointer\" onclick=\"favServiceItem('"+service.id+"')\"></a></span></td>";
            }
            tr += "</tr>";
        }
        serviceList = services;
        $("#serviceDataBody").html(tr);
    }

    function initPage(){
        var keyword = document.getElementById("keyword");
        keyword.addEventListener("keyup", function(event) {
            event.preventDefault();
            if (event.keyCode === 13) {
                search();
            }
        });
        $('#paging').paging({
            initPageNo: 1, // 初始页码
            totalPages: totalPage, //总页数
            totalCount: '合计' + totalCount + '条数据', // 条目总数
            slideSpeed: 600, // 缓动速度。单位毫秒
            jump: true, //是否支持跳转
            callback: function(pageNo) { // 回调函数
                pageIndex = pageNo-1;
                if(lastSeclectedPageNo!=pageNo){
                    search();
                    lastSeclectedPageNo = pageNo;
                }
            }
        })
    }
    
   
    function createClick(options){
        $(options.node).click(function(){
            for(let i = 0; i < array.length; i++){
                array[i].active = false
            }
            options.active = true;
            options.flag = !options.flag;
            if(options.flag){
                $('.table tr th').eq(array.findIndex(item => item.active == true)).find('img').removeClass('on').css('display' , 'inline-block').closest('th').siblings('th').find('img').hide();
            }else{
                $('.table tr th').eq(array.findIndex(item => item.active == true)).find('img').addClass('on').css('display' , 'inline-block').closest('th').siblings('th').find('img').hide();
            }
            search()
        })
    }
    for(let i = 0; i < array.length;i++){
        createClick(array[i])
    }
    function search(){
        var param = {};
        var keyword =$("#keyword").val();
        if(keyword == "请输入查询的服务名称"){
            keyword = "";
        }
        if(array.filter(item => item.active == true).length > 0){
            if(array.filter(item => item.active == true)[0].field == "serviceObjectName"  ||  array.filter(item => item.active == true)[0].field == "typeName"){
                return                 
            }
            param.orderBy = array.filter(item => item.active == true)[0].flag ? -1 : 1;
            param.order = array.filter(item => item.active == true)[0].field
        }else{
            param.order = "code"
            param.orderBy = 1
        }
        param.keyword = keyword;
        var type = $('#service-type-box > .active').attr('id');
        if(type!='all-type'){
            param.type = type;
        }
        var target = $('#service-object-box > .active').attr('id');
        if(target!='all-object'){
            param.target = target;
        }
        var handleWay = $('#service-handle-way > .active').attr('id');
        if(handleWay!='all-way'){
        	param.handleWay = handleWay;
        }
        var publisherOrg = $('#service-publish-dept > div > .active').attr('id');
        if(publisherOrg!="all-dept"){
            param.publisher = publisherOrg;
        }

        var related = $('#matters-tab > .active').attr('id');
        param.related = related;
        //设置loading的text和状态
        //loading.text('加载中.....');
        //loadingFunc(1);
        param.pageIndex = pageIndex;
        param.pageSize = pageSize;

        $.ajax({
            url:basePath + "nonlogin/serGuide/serviceGuideList.htm",
            data: param,
            dataType : "json",
            async:false,
            success: function (result) {
                totalPage = result.data.totalPage;
                totalCount = result.data.total;
                pageNum = result.data.currentPage;
                var services = result.data.data;
                // console.log(111,services)
                structureService(services)
            }
        });
    }


    

   
    function queryServiceTypeNameByTypeId(typeIds){
        var typeIdArr = typeIds.split(",");
        var typeNameArr = [];
        for(var i=0;i<typeIdArr.length;i++){
            var typeId = typeIdArr[i];
            typeName = serviceTypeJson[typeId];
            typeNameArr.push(typeName);
        }
        var typeNames= typeNameArr.join(",");
        return typeNames;
    }


    //根据角色ID 反查服务属于那些服务对象 ,涉及到到一个角色属于多个对象，这样就得拼接；还有多个角色属于同一个对象，这样还得去重。真TM麻烦。
    function queryServceObjectByRole(serviceRoleArr){
        var allObject = [];
        for(var k=0;k<serviceRoleArr.length;k++){
            var roleId = serviceRoleArr[k].roleid;
            for(var i=0;i<serviceObjectArr.length;i++){
                var serviceObject = serviceObjectArr[i];
                serviceObjectRoleIds = serviceObject.objectRole;
                if(serviceObjectRoleIds.indexOf(roleId)!=-1){
                    allObject.push(serviceObject.objectName);
                }
            }
        }
        var serviceObjectSet = new Set(allObject);
        // 解决IE不兼容Array.from的问题
        if(!Array.from){
            Array.from = function (el) {
                return Array.apply(this, el);
            }
        }
        var arr = Array.from(serviceObjectSet);
        var objectName = arr.join(",");
        return objectName;
    }

    //根据关键字进行搜索服务
    function searchByKey(){
        search();
        initPage();
    }

    // 我的事项、全部事项切换
    function mattersSwitch() {
        if(IS_LOGIN){
            $("#matters-tab button:first").addClass("active");
        }else{
            $("#matters-tab button:last").addClass("active");
        }
        $("#matters-tab button").on("click", function(event){
            $(this).addClass("active").siblings("button").removeClass("active");
            pageIndex = 0;
            pageSize = 21;
            totalPage = 0;
            totalCount = 0;
            search();
            initPage();
        });
    }

    // 服务分类切换
    function classifySwitch() {
        //服务类型
        $("#service-type-box li:first").addClass("active");
        $("#service-type-box > li").on("click", function(event){
            $(this).addClass("active").siblings("li").removeClass("active");
            pageIndex = 0;
            pageSize = 21;
            totalPage = 0;
            totalCount = 0;
            search();
            initPage();
        });

        //服务对象
        $("#service-object-box button:first").addClass("active");
        if(serviceObjectId){
            $("#service-object-box #"+serviceObjectId).addClass("active").siblings("button").removeClass("active");
        }
        $("#service-object-box > button").on("click", function(event){
            $(this).addClass("active").siblings("button").removeClass("active");
            pageIndex = 0;
            pageSize = 21;
            totalPage = 0;
            totalCount = 0;
            search();
            initPage();
        });

        //办理途径
        $("#service-handle-way button:first").addClass("active");
        $("#service-handle-way > button").on("click", function(event){
            $(this).addClass("active").siblings("button").removeClass("active");
            pageIndex = 0;
        	pageSize = 21;
        	totalPage = 0;
        	totalCount = 0;
          	search();
          	initPage();
        });

        //所属部门
        $("#service-publish-dept div button:first").addClass("active");
        if(deptId){
            $("#service-publish-dept div #"+deptId).addClass("active").siblings("button").removeClass("active");
        }
        $("#service-publish-dept div > button").on("click", function(event){
            $('#service-publish-dept > span').html(event.target.innerText + '<img src="/EIP/resources/images/select.png" alt="">')
            $(this).addClass("active").siblings("button").removeClass("active");
            pageIndex = 0;
            pageSize = 21;
            totalPage = 0;
            totalCount = 0;
            search();
            initPage();
        });

    }

    //加载服务类型
    var serviceTypeJson = {};
    function loadServiceType() {
        $.ajax({
            url: '/EIP/nonlogin/elobby/type/queryTypes.htm',
            async: false,
            success: function (result) {
                var data = result.data;
                var types = '<li id="all-type"><span>全部分类</span><span><img onload="SVGInject(this)" src="/EIP/resources/images/elobby/icon-right-arr.svg" alt=""></span></li>';
                for (var i = 0; i < data.length; i++) {
                    var typeObj = data[i];
                    var typeId = typeObj.id;
                    serviceTypeJson[typeId] = typeObj.typeName;
                    types += '<li id="'+typeId+'"><span title="'+ typeObj.typeName +'">'+ typeObj.typeName +'</span><span><img onload="SVGInject(this)" src="/EIP/resources/images/elobby/icon-right-arr.svg" alt=""></span></li>';
                }
                $("#service-type-box").html(types);
            }
        });
    }

    //加载服务对象
    var serviceObjectArr = [];
    function loadServiceObject(){
        $.ajax({
            url:'/EIP/nonlogin/serviceObject/queryServiceObjectList.htm',
            async:false,
            success:function(data){
                var serviceObjList = '<button class="btn btn-default" id="all-object">全部分类</button>';
                for(var i=0;i<data.data.length;i++){
                    serviceObjectArr = data.data;
                    var serviceObj = data.data[i];
                    var serviceObjId= serviceObj.id;
                    var serviceObjName = serviceObj.objectName;
                    serviceObjList+= '<button class="btn btn-default" id="'+serviceObjId+'">'+serviceObjName+'</button>';
                }
                $("#service-object-box").html(serviceObjList);
            }
        });
    }

    //加载办理途径
    var handleWayArr = [];
    function loadHandleWay(){
        $.ajax({
            url:'/EIP/nonlogin/transactWay/queryTransactWayList.htm',
            async:false,
            success:function(data){
                var handleWayList = '<button class="btn btn-default" id="all-way">全部分类</button>';
                handleWayArr = data.data;
                for(var i=0;i<data.data.length;i++){
                    var wayObj = data.data[i]
                    handleWayList+= '<button class="btn btn-default" id="'+wayObj.id+'">'+wayObj.transactWayName+'</button>';
                }
                $("#service-handle-way").html(handleWayList);
            }
        });
    }

    //查询办理方式名称 方便页面回显
    function queryHandleWay(id){
        var transactWayName = '';
        for(var i=0;i<handleWayArr.length;i++){
            var handleWay = handleWayArr[i];
            if(id == handleWay.id) {
                transactWayName = handleWay.transactWayName;
            }
        }
        return transactWayName;
    }

    //加载部门
    function loadDept(){
        $.ajax({
            url:'/EIP/nonlogin/serviceHandleCenter/queryDirectDeptList.htm',
            async:false,
            success:function(res){
                var data = res.data;
                var deptList = '<button class="btn btn-default" id="all-dept">全部部门</button>';
                for(var i=0;i<data.length;i++){
                    var dept = data[i]
                    deptList+= '<button class="btn btn-default" id="'+dept.deptId+'">'+dept.deptName+'</button>';
                }
                $("#service-publish-dept div").html(deptList);
            }
        });
    }

    //根据关键字进行搜索服务
    function searchByKey(){
        search();
        initPage();
    }

    //重置条件查询
    function reset(){
        $("#keyword").val("");
        if(IS_LOGIN){
            $("#matters-tab button:first").addClass("active").siblings("button").removeClass("active");
        }else{
            $("#matters-tab button:last").addClass("active").siblings("button").removeClass("active");
        }

        $(".service-screening .row").each(function(){
            $(this).find(".service-screening-items button:first").addClass("active").siblings("button").removeClass("active");
        });
        search();
        initPage();
    }

</script>
</body>
