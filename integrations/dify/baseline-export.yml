    opening_statement: '你好，我是 CampusPilot。当前可依据项目整理的公开资料，提供成都理工大学校园卡挂失、研究生在读证明、2026–2027
      学年学费电子票据的指引，并展示官方出处。

      资料仍待人工复核；地图导航和学校业务接口尚未接入。请勿发送密码、证件号或验证码。'
