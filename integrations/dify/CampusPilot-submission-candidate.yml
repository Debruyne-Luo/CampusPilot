          \ str, references: str) -> dict:\n    ids = json.loads(references)\n   \
          \ # references is wired exclusively from parse_result, never from a model\
          \ or sys.query.\n    if state not in (\"success\", \"needs_clarification\"\
          , \"out_of_scope\", \"empty\", \"unavailable\"):\n        raise ValueError(\"\
          Invalid workflow state\")\n    if not isinstance(text, str) or not text.strip()\
