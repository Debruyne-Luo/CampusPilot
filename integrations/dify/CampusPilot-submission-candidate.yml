    - id: cp_request
      type: custom
      position:
        x: 650
        y: 250
      positionAbsolute:
        x: 650
        y: 250
      width: 242
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        title: 校验参数
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code node: validate extracted intent; never accept identifiers\
          \ or URLs.\"\"\"\n\nimport json\nimport re\n\n\ndef main(text: str) -> dict:\n\
          \    blank = {\n        \"kind\": \"unknown\",\n        \"query\": \"\"\
          ,\n        \"service_key\": \"unknown\",\n        \"audience\": \"unknown\"\
          ,\n        \"academic_year\": None,\n    }\n    try:\n        data = json.loads(text)\n\
          \        if not isinstance(data, dict) or set(data) - set(blank):\n    \
          \        raise ValueError()\n        body = {**blank, **data}\n        if\
          \ body[\"kind\"] not in (\"service\", \"teacher\", \"place\", \"unknown\"\
          ):\n            raise ValueError()\n        if body[\"service_key\"] not\
          \ in (\n            \"campus_card_loss\",\n            \"campus_card_replacement\"\
          ,\n            \"enrollment_proof\",\n            \"tuition_receipt\",\n\
          \            \"unknown\",\n        ):\n            raise ValueError()\n\
          \        if body[\"audience\"] not in (\"graduate\", \"undergraduate\",\
          \ \"staff\", \"unknown\"):\n            raise ValueError()\n        if not\
          \ isinstance(body[\"query\"], str) or len(body[\"query\"]) > 120:\n    \
          \        raise ValueError()\n        year = body[\"academic_year\"]\n  \
          \      if year is not None and (\n            not isinstance(year, str)\
          \ or not re.fullmatch(r\"\\d{4}-\\d{4}\", year)\n        ):\n          \
          \  raise ValueError()\n        # A recognized service key already identifies\
          \ a service. The model can otherwise\n        # return kind=unknown alongside\
          \ campus_card_replacement for a clear normal question.\n        if body[\"\
          kind\"] == \"unknown\" and body[\"service_key\"] != \"unknown\":\n     \
          \       body[\"kind\"] = \"service\"\n        blank = body\n    except (ValueError,\
          \ TypeError):\n        pass\n    return {\"body\": json.dumps(blank, ensure_ascii=False)}\n"
        variables:
        - variable: text
          value_selector:
          - cp_intent
          - text
        outputs:
          body:
            type: string
            children: null
