      positionAbsolute:
        x: 1250
        y: 250
      width: 242
      height: 90
      sourcePosition: right
      targetPosition: left
      data:
        title: 取得真实结果ID
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code node: references come only from the actual authenticated\
          \ HTTP response.\"\"\"\n\nimport json\nimport re\n\n\ndef main(body: str,\
          \ status_code: int) -> dict:\n    failure = {\n        \"state\": \"unavailable\"\
          ,\n        \"context\": \"\",\n        \"reply\": \"业务查询暂不可用，请稍后再试。\",\n\
          \        \"references\": json.dumps({\"service_ids\": [], \"teacher_ids\"\
          : [], \"place_ids\": []}),\n    }\n    try:\n        data = json.loads(body)\n\
          \        if status_code != 200 or not isinstance(data, dict):\n        \
          \    return failure\n        state = data.get(\"status\")\n        if state\
          \ not in (\"success\", \"needs_clarification\", \"out_of_scope\", \"empty\"\
          ):\n            return failure\n        reply = data.get(\"message\")\n\
          \        if not isinstance(reply, str) or not reply.strip() or len(reply)\
          \ > 2000:\n            return failure\n        references = {}\n       \
          \ for plural, key, limit in (\n            (\"services\", \"service_id\"\
          , 8),\n            (\"teachers\", \"teacher_id\", 8),\n            (\"places\"\
          , \"place_id\", 25),\n        ):\n            records = data.get(plural,\
          \ [])\n            if not isinstance(records, list) or len(records) > limit:\n\
          \                return failure\n            ids = []\n            for record\
          \ in records:\n                if not isinstance(record, dict) or record.get(\"\
          synthetic\") is not False:\n                    return failure\n       \
          \         ident = record.get(key)\n                if not isinstance(ident,\
          \ str) or not re.fullmatch(\n                    r\"cdut:[a-z0-9][a-z0-9:-]*\"\
          , ident\n                ):\n                    return failure\n      \
          \          if ident not in ids:\n                    ids.append(ident)\n\
          \            references[key + \"s\"] = ids\n        if state not in (\"\
          success\", \"needs_clarification\") and any(references.values()):\n    \
          \        return failure\n        if state == \"success\" and (not any(references.values())\
          \ or not data.get(\"evidence\")):\n            return failure\n        return\
          \ {\n            \"state\": state,\n            \"context\": json.dumps(data,\
          \ ensure_ascii=False),\n            \"reply\": reply,\n            \"references\"\
          : json.dumps(references, ensure_ascii=False),\n        }\n    except (ValueError,\
          \ TypeError):\n        return failure\n"
        variables:
        - variable: body
          value_selector:
          - cp_http
          - body
        - variable: status_code
          value_selector:
          - cp_http
          - status_code
