[project]
name = "campuspilot"
version = "0.1.0"
description = "Offline synthetic CampusPilot core skeleton"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
campuspilot = "campuspilot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1.19,<3", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
