[project]
name = "campuspilot"
version = "0.1.0"
description = "CDUTdino single-agent campus assistant"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.135,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pillow>=12,<13"]
# Optional vector backend; without it retrieval falls back to pure-Python cosine.
vector = ["sqlite-vec>=0.1.6,<0.2", "numpy>=2,<3"]
# Offline official-document maintenance; XLSX parsing uses the standard library.
maintenance = ["pypdf>=6.10,<7"]

[project.scripts]
campuspilot = "campuspilot.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend/src"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "mypy>=1.19,<3",
    "ruff>=0.14,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "types-pyyaml>=6,<7",
    "sqlite-vec>=0.1.6,<0.2",
    "numpy>=2,<3",
    "pillow>=12,<13",
]

